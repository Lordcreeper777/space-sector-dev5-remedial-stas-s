services:
  api:
    build:
      context: ./backend/SpaceSector.Api
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "${API_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SpaceSectorDb: "Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

    depends_on:
      database:
        condition: service_healthy

  game:
    build:
      context: ./game/SpaceSector
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "${GAME_PORT}:80"

    depends_on:
      - api

  database:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${DATABASE_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
